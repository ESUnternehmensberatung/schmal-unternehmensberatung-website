<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Serif'; src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-normal.woff2') format('woff2'); font-weight: 200 900; }
  @font-face { font-family: 'Serif'; src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-italic.woff2') format('woff2'); font-weight: 200 900; font-style: italic; }
  @font-face { font-family: 'Sans'; src: url('../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    background:
      radial-gradient(ellipse 900px 520px at 85% 50%, rgba(26, 58, 92, 0.55), transparent 70%),
      #0f2438;
    overflow: hidden;
    font-family: 'Sans', sans-serif;
  }
  /* Inhalt rechts: links unten sitzt auf LinkedIn das Profilbild */
  .inhalt {
    position: absolute;
    right: 120px;
    top: 50%;
    transform: translateY(-50%);
    width: 820px;
  }
  .wortmarke { display: block; height: 62px; width: auto; }
  .linie { width: 72px; height: 2px; background: #c9a87c; margin: 34px 0 30px; }
  .slogan {
    margin: 0;
    font-family: 'Serif', serif;
    font-weight: 400;
    font-size: 50px;
    line-height: 1.16;
    letter-spacing: -0.005em;
    color: #ffffff;
  }
  .slogan em { font-style: italic; color: #c9a87c; }
  .web {
    position: absolute;
    right: 120px;
    bottom: 34px;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: #b4c0cf;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="inhalt">
      <p class="slogan">Digitale Transformation<br />für <em>Mittelstand und Freiberuf</em></p>
    </div>
    <div class="web">schmal-unternehmensberatung.de</div>
  </div>
</body>
</html>
