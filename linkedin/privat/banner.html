<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Serif'; src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-normal.woff2') format('woff2'); font-weight: 200 900; }
  @font-face { font-family: 'Sans'; src: url('../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    background:
      radial-gradient(ellipse 900px 520px at 80% 50%, rgba(26, 58, 92, 0.55), transparent 70%),
      #0f2438;
    overflow: hidden;
    font-family: 'Sans', sans-serif;
  }
  .zeichen { position: absolute; top: 40px; right: 40px; width: 64px; height: auto; }
  /* Inhalt rechtsbündig: links unten sitzt auf LinkedIn das Profilbild */
  .inhalt { position: absolute; right: 150px; top: 50%; transform: translateY(-50%); text-align: right; }
  .name { margin: 0; font-family: 'Serif', serif; font-weight: 500; font-size: 68px; line-height: 1; letter-spacing: 0.01em; color: #ffffff; }
  .titel { margin: 18px 0 0; font-size: 30px; font-weight: 500; letter-spacing: 0.04em; color: #c9a87c; }
  .linie { width: 72px; height: 2px; background: #c9a87c; margin: 30px 0 24px auto; }
  .web { margin: 0; font-size: 19px; line-height: 1.6; letter-spacing: 0.05em; color: #b4c0cf; }
</style>
</head>
<body>
  <div class="banner">
    <img class="zeichen" src="../../assets/logo/logo-zeichen-transparent.png" alt="" />
    <div class="inhalt">
      <p class="name">Eduard Schmal</p>
      <p class="titel">Digital Transformation &amp; AI</p>
      <div class="linie"></div>
      <p class="web">schmal-unternehmensberatung.de<br />fördermittel-finder.de</p>
    </div>
  </div>
</body>
</html>
