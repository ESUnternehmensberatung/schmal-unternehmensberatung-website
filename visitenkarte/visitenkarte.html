<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Visitenkarte Eduard Schmal</title>
<style>
  /* Endformat 85 × 55 mm, je 3 mm Beschnitt rundum = 91 × 61 mm. Sicherheitsabstand 4 mm zum Endformat. */
  @font-face { font-family: 'Source Serif 4'; src: url('../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2') format('woff2'); font-weight: 200 900; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @page { size: 91mm 61mm; margin: 0; }
  :root { --navy: #0f2438; --gold: #c9a87c; --gold-deep: #7a5c33; --ivory: #f7f4ee; --stone: #5a6572; --ink: #1a2330; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 91mm; }
  .seite { width: 91mm; height: 61mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; }
  .seite:last-child { page-break-after: auto; break-after: auto; }
  /* Inhaltsbereich = Endformat minus 4 mm Sicherheitsabstand, plus 3 mm Beschnitt */
  .inhalt { position: absolute; left: 10mm; right: 10mm; top: 9mm; bottom: 9mm; }

  .vorne { background: #ffffff; color: var(--ink); font-family: 'Hanken Grotesk', Arial, sans-serif; }
  .vorne .inhalt { display: grid; grid-template-rows: auto 1fr; left: 8.5mm; right: 8mm; top: 7.5mm; bottom: 7.5mm; }
  .name { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 13.5pt; line-height: 1.1; color: var(--navy); letter-spacing: -0.01em; }
  .slogan { margin-top: 1.4mm; font-size: 6.6pt; line-height: 1.3; color: var(--stone); white-space: nowrap; }
  .linie { width: 9mm; height: 0.4mm; background: var(--gold); margin-top: 2.4mm; }
  .unten { display: flex; justify-content: space-between; align-items: center; gap: 4mm; min-height: 0; }
  .kontakt { font-size: 6.4pt; line-height: 1.75; white-space: nowrap; color: var(--ink); font-variant-numeric: lining-nums; }
  .kontakt span { display: inline-block; width: 7.5mm; color: var(--gold-deep); font-weight: 600; }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 1.2mm; flex: none; }
  .qr img { width: 22mm; height: 22mm; display: block; }
  .qr p { font-size: 5.2pt; letter-spacing: 0.06em; text-transform: uppercase; color: var(--stone); }

  .hinten { background: var(--navy); display: grid; place-items: center; }
  .hinten img { width: 46mm; height: auto; display: block; }
</style>
</head>
<body>
  <section class="seite vorne">
    <div class="inhalt">
      <div>
        <p class="name">Eduard Schmal</p>
        <p class="slogan">Digitale Transformation für Mittelstand und freie Berufe</p>
        <div class="linie"></div>
      </div>
      <div class="unten">
        <p class="kontakt">
          <span>Mail</span>es@schmal-unternehmensberatung.de<br />
          <span>Mobil</span>+49 1522 685 95 24<br />
          <span>Web</span>schmal-unternehmensberatung.de
        </p>
        <div class="qr">
          <img src="qr-vcard.svg" alt="QR-Code: Kontakt speichern" />
          <p>Kontakt speichern</p>
        </div>
      </div>
    </div>
  </section>
  <section class="seite hinten">
    <img src="../assets/logo/logo-quer-transparent.png" alt="Schmal Unternehmensberatung" />
  </section>
</body>
</html>
